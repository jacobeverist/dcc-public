<!doctype html>
<!--

  cells and pooled by a k-winner-take-all network. Its own build target (`pooling-visual` →
  dist-pooling-visual/), NOT a URL into the shared embed: the network is compiled into the
  bundle from src/pooling-visual-app/network.json, so there is no URL parameter that could
  load a different one. Entry: src/pooling-visual-app/main.tsx.
-->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- This app has NO demo manifest — it ships one network and no demo picker. The shared
         toolbar still mounts the (hidden) picker, whose hook fetches this URL unconditionally;
         an inline empty list answers it without a request, instead of 404ing on a
         /demos/index.json that this target deliberately does not ship. -->
    <meta name="dcc-demos" content="data:application/json,[]" />
    <title>Pooling Visualization</title>
